name: Test public MCP source

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public SDK dependency
        run: python -m pip install --disable-pip-version-check -r requirements-shared.txt
      - name: Run synthetic Python tests
        run: python -m unittest discover -s tests -v

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Worker dependencies without deploy credentials
        working-directory: cloudflare_worker
        run: npm install --no-audit --no-fund
      - name: Run Worker source tests and syntax check
        working-directory: cloudflare_worker
        run: npm test && npm run check

  fastmcp-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install experimental SDK
        run: python -m pip install --disable-pip-version-check 'fastmcp==4.1.0'
      - name: Run wholly synthetic proxy smoke
        run: python experiments/fastmcp4/smoke.py


  sdk-matched-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install each SDK into its own ephemeral environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/mcp-sdk2"
          python -m venv "$RUNNER_TEMP/mcp-fastmcp4"
          "$RUNNER_TEMP/mcp-sdk2/bin/python" -m pip install -q --disable-pip-version-check 'mcp==2.3.0'
          "$RUNNER_TEMP/mcp-fastmcp4/bin/python" -m pip install -q --disable-pip-version-check 'fastmcp==4.1.0'
      - name: Run matched in-process five-tool fixtures
        shell: bash
        run: |
          set -euo pipefail
          receipt2="$("$RUNNER_TEMP/mcp-sdk2/bin/python" experiments/sdk_comparison/benchmark.py mcp2)"
          receipt4="$("$RUNNER_TEMP/mcp-fastmcp4/bin/python" experiments/sdk_comparison/benchmark.py fastmcp4)"
          SDK2="$receipt2" FASTMCP4="$receipt4" python - <<'PY'
          import json, os
          a, b = (json.loads(os.environ[k]) for k in ("SDK2", "FASTMCP4"))
          for row, sdk, version in ((a, "mcp2", "2.3.0"), (b, "fastmcp4", "4.1.0")):
              assert row["verified"] is True and row["synthetic"] is True
              assert row["sdk"] == sdk and row["sdk_version"] == version
              assert row["five_tool_names_schemas_results"] is True
              assert row["unknown_tool_denied"] is True
              assert row["calls_measured"] == 50
              assert row["real_atlas_tested"] is False
              assert row["transport"] == "in_process"
              assert 0 < row["peak_rss_mib"] < 2048
          assert a["python"] == b["python"]
          assert a["architecture"] == b["architecture"]
          print("mcp2:", json.dumps(a, sort_keys=True))
          print("fastmcp4:", json.dumps(b, sort_keys=True))
          PY


  persistent-http-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Prepare separate SDK environments
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/http-sdk2"
          python -m venv "$RUNNER_TEMP/http-fastmcp4"
          "$RUNNER_TEMP/http-sdk2/bin/python" -m pip install -q --disable-pip-version-check 'mcp==2.3.0'
          "$RUNNER_TEMP/http-fastmcp4/bin/python" -m pip install -q --disable-pip-version-check 'fastmcp==4.1.0'
      - name: Measure real loopback Streamable HTTP servers, synthetic tools only
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/http-sdk2/bin/python" -B -m experiments.http_compare.measure \
            "$RUNNER_TEMP/http-sdk2/bin/python" \
            "$RUNNER_TEMP/http-fastmcp4/bin/python"

  pinned-real-atlas-source-parity:
    name: Verify canonical Atlas data with the one-process MCP
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out public source at the exact Atlas image revision
        uses: actions/checkout@v4
        with:
          repository: Dmitry-dev-pet/rulers-chronology-audit
          ref: cb3c65853628607f2e03f30bc4e1a47063b13cd4
          path: .pinned-atlas
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned public MCP SDK
        run: python -m pip install -q --disable-pip-version-check -r requirements-shared.txt
      - name: Build canonical SQLite in isolated runner from public source
        working-directory: .pinned-atlas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/atlas-snapshot"
          python -m scripts.atlas_db build --output "$RUNNER_TEMP/atlas-snapshot" > /dev/null
          test -s "$RUNNER_TEMP/atlas-snapshot/atlas.sqlite"
      - name: Check exact five real-source tool signatures and results
        env:
          ALFRED_PINNED_ATLAS_ROOT: ${{ github.workspace }}/.pinned-atlas
          ALFRED_PINNED_ATLAS_DB: ${{ runner.temp }}/atlas-snapshot/atlas.sqlite
          ALFRED_REQUIRE_PINNED_ATLAS: '1'
        run: python -m unittest discover -s tests -p 'test_pinned_atlas_source_parity.py' -v
