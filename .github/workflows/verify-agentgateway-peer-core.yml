name: Verify Agentgateway Peer Chat production core candidate

on:
  pull_request:
    paths:
      - "alfred_gateway_core/**"
      - "release/agentgateway-peer/**"
      - "tests/test_agentgateway_runtime.py"
      - ".github/workflows/verify-agentgateway-peer-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-image-off-vps:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install production Python dependencies for source and policy checks
        run: |
          python -m pip install --disable-pip-version-check 'mcp==2.3.0' 'PyYAML==6.0.3'
      - name: Unit-test strict private Host and no-fixture runtime
        run: |
          python -m unittest discover -s tests -p test_agentgateway_runtime.py -v
          python -m compileall -q alfred_gateway_core/
      - name: Confirm image source excludes fake JWT issuer and unrelated services
        shell: bash
        run: |
          set -euo pipefail
          ! grep -r -E 'dual_issuer|owner_marker|ALFRED_CI_TEST_ONLY|private_key|CONTROL_PLANE_API_KEY' alfred_gateway_core release/agentgateway-peer/entrypoint.sh
          test -f release/agentgateway-peer/ci/issue_fake_tokens.py
          test -f release/agentgateway-peer/ci/probe.py
      - name: Build production image with pinned upstream Agentgateway release
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull \
            --build-arg SOURCE_SHA="$(git rev-parse HEAD)" \
            -f release/agentgateway-peer/Dockerfile \
            -t alfred-gateway-core:source-ci .
          docker image inspect alfred-gateway-core:source-ci \
            --format '{{index .Config.Labels "alfred.release_role"}} {{.Config.User}}' \
            | grep -qx 'agentgateway-peer-core-no-issuer 10001:10001'
      - name: Single Docker image, two JWT issuers outside image, two isolated client networks
        shell: bash
        run: |
          set -euo pipefail
          bash release/agentgateway-peer/ci/smoke_production.sh alfred-gateway-core:source-ci
